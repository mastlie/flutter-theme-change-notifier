name: theme_app
description: A Flutter theme management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Provider untuk state management
  provider: ^6.1.1
  
  # Shared preferences untuk menyimpan preferensi tema (opsional)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
